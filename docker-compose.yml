
services:
  book-postgres:
    image: postgres:17
    container_name: book-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookuser
      POSTGRES_PASSWORD: bookpass123
      POSTGRES_DB: bookdb
    ports:
      - "5433:5432"
    volumes:
      - book_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookuser -d bookdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: book-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      book-postgres:
        condition: service_healthy

volumes:
  book_postgres_data:
